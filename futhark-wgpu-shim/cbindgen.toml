# The header Futhark's generated C compiles against: webgpu/webgpu.h.
# Generated by build.rs on every build; include/webgpu/webgpu.h is the
# committed copy, and a test checks the two are byte-identical.
language = "C"
include_guard = "FUTHARK_WGPU_SHIM_WEBGPU_H"
autogen_warning = """/* Generated by cbindgen from futhark-wgpu-shim/src (build.rs). Do not edit:
 * change the Rust and rebuild. This is the subset of the WebGPU C API that
 * Futhark's webgpu runtime uses (futhark-wgpu-shim/surface/), implemented
 * over wgpu-rs. Not the upstream webgpu.h. */"""
style = "both"
cpp_compat = true
sys_includes = ["stdint.h", "stddef.h"]
no_includes = true
usize_is_size_t = true

[parse]
parse_deps = false

[fn]
rename_args = "CamelCase"

[struct]
rename_fields = "CamelCase"

[export]
# emscripten_sleep is declared by include/emscripten.h, not by webgpu.h.
exclude = ["emscripten_sleep"]
include = [
  "WGPUBufferBindingType", "WGPUCallbackMode", "WGPUSType", "WGPUFeatureName",
  "WGPUCompilationMessageType", "WGPUErrorType", "WGPUShaderStage",
  "WGPUBufferUsage", "WGPUMapMode", "WGPUBool", "WGPUShaderSourceWGSL",
]

[export.rename]
"BUFFER_USAGE_MAP_READ" = "WGPUBufferUsage_MapRead"
"BUFFER_USAGE_MAP_WRITE" = "WGPUBufferUsage_MapWrite"
"BUFFER_USAGE_COPY_SRC" = "WGPUBufferUsage_CopySrc"
"BUFFER_USAGE_COPY_DST" = "WGPUBufferUsage_CopyDst"
"BUFFER_USAGE_UNIFORM" = "WGPUBufferUsage_Uniform"
"BUFFER_USAGE_STORAGE" = "WGPUBufferUsage_Storage"
"MAP_MODE_READ" = "WGPUMapMode_Read"
"MAP_MODE_WRITE" = "WGPUMapMode_Write"
"SHADER_STAGE_COMPUTE" = "WGPUShaderStage_Compute"
"STYPE_SHADER_SOURCE_WGSL" = "WGPUSType_ShaderSourceWGSL"
"CALLBACK_MODE_WAIT_ANY_ONLY" = "WGPUCallbackMode_WaitAnyOnly"
"CALLBACK_MODE_ALLOW_PROCESS_EVENTS" = "WGPUCallbackMode_AllowProcessEvents"
"CALLBACK_MODE_ALLOW_SPONTANEOUS" = "WGPUCallbackMode_AllowSpontaneous"
"STATUS_SUCCESS" = "WGPUStatus_Success"
"STATUS_ERROR" = "WGPUStatus_Error"
"WAIT_STATUS_SUCCESS" = "WGPUWaitStatus_Success"
"WAIT_STATUS_TIMED_OUT" = "WGPUWaitStatus_TimedOut"
"WAIT_STATUS_ERROR" = "WGPUWaitStatus_Error"
"MAP_ASYNC_STATUS_SUCCESS" = "WGPUMapAsyncStatus_Success"
"MAP_ASYNC_STATUS_ERROR" = "WGPUMapAsyncStatus_Error"
"REQUEST_ADAPTER_STATUS_SUCCESS" = "WGPURequestAdapterStatus_Success"
"REQUEST_ADAPTER_STATUS_UNAVAILABLE" = "WGPURequestAdapterStatus_Unavailable"
"REQUEST_DEVICE_STATUS_SUCCESS" = "WGPURequestDeviceStatus_Success"
"REQUEST_DEVICE_STATUS_ERROR" = "WGPURequestDeviceStatus_Error"
"QUEUE_WORK_DONE_STATUS_SUCCESS" = "WGPUQueueWorkDoneStatus_Success"
"COMPILATION_INFO_REQUEST_STATUS_SUCCESS" = "WGPUCompilationInfoRequestStatus_Success"
"COMPILATION_MESSAGE_TYPE_ERROR" = "WGPUCompilationMessageType_Error"
"COMPILATION_MESSAGE_TYPE_WARNING" = "WGPUCompilationMessageType_Warning"
"COMPILATION_MESSAGE_TYPE_INFO" = "WGPUCompilationMessageType_Info"
"ERROR_TYPE_VALIDATION" = "WGPUErrorType_Validation"
"ERROR_TYPE_OUT_OF_MEMORY" = "WGPUErrorType_OutOfMemory"
"ERROR_TYPE_INTERNAL" = "WGPUErrorType_Internal"
"BUFFER_BINDING_TYPE_BINDING_NOT_USED" = "WGPUBufferBindingType_BindingNotUsed"
"BUFFER_BINDING_TYPE_UNIFORM" = "WGPUBufferBindingType_Uniform"
"BUFFER_BINDING_TYPE_STORAGE" = "WGPUBufferBindingType_Storage"
"BUFFER_BINDING_TYPE_READ_ONLY_STORAGE" = "WGPUBufferBindingType_ReadOnlyStorage"
"FEATURE_NAME_SHADER_F16" = "WGPUFeatureName_ShaderF16"
"STRLEN" = "WGPU_STRLEN"
"LIMIT_U32_UNDEFINED" = "WGPU_LIMIT_U32_UNDEFINED"
