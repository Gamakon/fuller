# THE ANTI-SCAN TEST AT 1,000,000 RECORDS (fuller docs/PLAN_true_gep_wgsl.md
# task UI2, second size): v24_ingest250k at four times the records:
# 1,000,000 stream rows + the same 2,500 oracles, five microbatches of
# 200,000. At 250,000 the run-4 scan, given 128 MiB arenas, beat today's
# index on recall (0.9994 vs 0.9744 at stage 5) and search (5.4 s vs 16.8 s);
# its search grows with the records, today's barely, so this size measures
# where they cross. The arenas stay 32 MiB a kind a seed: 67 bytes a record
# at stage 5.
#
# The data: /Users/andrewmorgan/data/arm/v24_test_1m (qdrant
# experiments/v24_ingest/prep_arm_test.py --n-stream 1000000 --n-oracle 2500,
# the same seeds, salt and oracles), today's index built and counted on it,
# the case exported to /Users/andrewmorgan/data/arm/v24_case_1m.
#
# A MICROBATCH ARRIVES IN SUB-BATCHES OF `chunk` (50,000) ROWS: a dispatch
# holds at most 65,535 workgroups a dimension, and ingest (one workgroup a
# row) and the key projection would need 200,000. Each microbatch is projected
# into, and ingested from, sub = per_section / chunk buffers of 50,000 rows
# (409.6 MB a seed each, one binding each, under the adapter's limit); each
# ingest dispatch's cfg names its sub-batch (arrived_begin..arrived_end its
# 50,000 rows), so a design sees 20 arrivals of 50,000 and a search after
# every fourth. Resident: 4 seeds x 20 sub-batches x 409.6 MB = 32.8 GB.
#
# Everything else is v24_ingest250k's (and so v24_ingest5b's).

name = "v24_ingest1m"
description = "v24 streaming ingestion at 1,000,000 + 2,500 (the anti-scan test), stages 1..5 of 200,000 arriving in sub-batches of 50,000, ingest sees only its microbatch's keys and search none, arenas 32 MiB a kind a seed: four seeds' 2,048-D keys in five microbatches into four per-seed GPU indexes, searched after each, pooled and re-ranked exactly; HFF over per-window misses, pool size, broken entries and per-stage ingest and search GPU ms against today's index"
work = "n_stream * n_queries"
alias = "distinct"
binding_limit = "adapter"

[params]
# The stages judged: sections 1..stages arrive (every section by default; a
# smoke test judges one).
stages = "sections"
# The queries judged (all the oracles; a test may judge fewer).
n_queries = "n_oracle"
# The contract constant: candidates per seed per query.
c_max = "64"
seeds = "4"
# Each index arena: 8,388,608 words, 32 MiB (v24_ingest5b's). At 250,000
# records that is the memory budget: 268 bytes a record for both arenas.
arena_u32 = "8388608"
arena_f32 = "8388608"
# A microbatch's sub-batches: chunk rows each (a dispatch's workgroups and one
# key binding), sub of them.
chunk = "50000"
sub = "per_section / chunk"

[kernel]
entry = "ingest"
entries = ["search"]
passes_header = true
reference = "../v24_ingest_small/reference.wgsl"

# The key projection: harness machinery, hand-written, run by the setup only.
[[machine]]
name = "project"
source = "project.wgsl"
entry = "project"

[[machine.binding]]
binding = 0
name = "rec_offsets"
kind = "storage_read"
element = "u32"

[[machine.binding]]
binding = 1
name = "rec_indices"
kind = "storage_read"
element = "u32"

[[machine.binding]]
binding = 2
name = "rec_values"
kind = "storage_read"
element = "f32"

[[machine.binding]]
binding = 3
name = "keys"
kind = "storage_read_write"
element = "f32"

[[machine.binding]]
binding = 4
name = "pcfg"
kind = "uniform"
fields = ["u32", "u32", "u32", "u32"]

[[binding]]
binding = 0
name = "keys"
kind = "storage_read"
element = "f32"

[[binding]]
binding = 1
name = "queries"
kind = "storage_read"
element = "f32"

[[binding]]
binding = 2
name = "index_u32"
kind = "storage_read_write"
element = "u32"

[[binding]]
binding = 3
name = "index_f32"
kind = "storage_read_write"
element = "f32"

[[binding]]
binding = 4
name = "cands"
kind = "storage_read_write"
element = "u32"

[[binding]]
binding = 5
name = "cfg"
kind = "uniform"
fields = ["u32", "u32", "u32", "u32", "u32", "u32", "u32", "u32"]

# Every record's raw sparse unit vector, CSR, row id order (stream rows,
# then the oracles: oracle q is row n_stream + q).
[[input]]
name = "rec_offsets"
element = "u32"
shape = ["n_total + 1"]

[[input]]
name = "rec_indices"
element = "u32"
shape = ["nnz"]

[[input]]
name = "rec_values"
element = "f32"
shape = ["nnz"]

[[input]]
name = "oracle_half"
element = "u32"
shape = ["n_oracle"]

# Per stage: each oracle's accept set (every arrived stream row within 1e-6
# of its 10th true cosine), and today's index's misses, candidates pooled and
# search ms, per oracle.
[[input]]
name = "accept_s1_offsets"
element = "u32"
shape = ["n_oracle + 1"]

[[input]]
name = "accept_s1_rows"
element = "u32"
shape = ["accept_n1"]

[[input]]
name = "accept_s2_offsets"
element = "u32"
shape = ["n_oracle + 1"]

[[input]]
name = "accept_s2_rows"
element = "u32"
shape = ["accept_n2"]

[[input]]
name = "accept_s3_offsets"
element = "u32"
shape = ["n_oracle + 1"]

[[input]]
name = "accept_s3_rows"
element = "u32"
shape = ["accept_n3"]

[[input]]
name = "accept_s4_offsets"
element = "u32"
shape = ["n_oracle + 1"]

[[input]]
name = "accept_s4_rows"
element = "u32"
shape = ["accept_n4"]

[[input]]
name = "accept_s5_offsets"
element = "u32"
shape = ["n_oracle + 1"]

[[input]]
name = "accept_s5_rows"
element = "u32"
shape = ["accept_n5"]

[[input]]
name = "today_s1_misses"
element = "u32"
shape = ["n_oracle"]

[[input]]
name = "today_s1_pooled"
element = "u32"
shape = ["n_oracle"]

[[input]]
name = "today_s1_search_ms"
element = "f32"
shape = ["n_oracle"]

[[input]]
name = "today_s2_misses"
element = "u32"
shape = ["n_oracle"]

[[input]]
name = "today_s2_pooled"
element = "u32"
shape = ["n_oracle"]

[[input]]
name = "today_s2_search_ms"
element = "f32"
shape = ["n_oracle"]

[[input]]
name = "today_s3_misses"
element = "u32"
shape = ["n_oracle"]

[[input]]
name = "today_s3_pooled"
element = "u32"
shape = ["n_oracle"]

[[input]]
name = "today_s3_search_ms"
element = "f32"
shape = ["n_oracle"]

[[input]]
name = "today_s4_misses"
element = "u32"
shape = ["n_oracle"]

[[input]]
name = "today_s4_pooled"
element = "u32"
shape = ["n_oracle"]

[[input]]
name = "today_s4_search_ms"
element = "f32"
shape = ["n_oracle"]

[[input]]
name = "today_s5_misses"
element = "u32"
shape = ["n_oracle"]

[[input]]
name = "today_s5_pooled"
element = "u32"
shape = ["n_oracle"]

[[input]]
name = "today_s5_search_ms"
element = "f32"
shape = ["n_oracle"]

# The candidates: per stage, seed and query, C_MAX stream-row ids (pads
# 0xFFFFFFFF), stage-major. Judged per window (stage x oracle half): the
# four seeds' lists pooled (pads dropped, deduplicated), broken entries
# (not arrived stream rows) counted, the rest re-ranked by exact cosine of
# the records, the top 10 counted against the accept set.
[[output]]
name = "cands"
element = "u32"
shape = ["stages * seeds * n_queries", "c_max"]
kind = "pooled_recall"

[output.pooled]
seeds = "seeds"
stages = "stages"
queries = "n_queries"
top = "10"
arrived = "stage * per_section"
query_row = "n_stream + q"
rec_offsets = "rec_offsets"
rec_indices = "rec_indices"
rec_values = "rec_values"
half = "oracle_half"
accept_offsets = "accept_s{stage}_offsets"
accept_rows = "accept_s{stage}_rows"
today_misses = "today_s{stage}_misses"
today_pooled = "today_s{stage}_pooled"

# The ingest through stage k: every pass of every seed of stages 1..k, summed
# (the measured cost of having indexed everything arrived), against today's
# build of sections 1..k (index_builds.json build_ms: one whole build, not
# incremental; the manifest's today_settle_ms_<k>).
[[output.pooled.timing]]
sample = "ingest{stage}"
cumulative = true
today = "today_settle_ms_{stage}"

# A stage's search: every seed's search dispatch, against today's search of
# the same queries (each oracle's total_ms, summed).
[[output.pooled.timing]]
sample = "search{stage}"
today_input = "today_s{stage}_search_ms"

# THE KEYS ARE PROJECTED ON THE DEVICE (the team lead's task, Andrew's design:
# raw records in, the projection part of the GPU pipeline): the CSR records
# are the only resident inputs; the machinery kernel project.wgsl ([[machine]]
# project, qdrant's pinned Rademacher formula) fills each seed's queries (the
# oracle records' keys) and, per stage k, a keys buffer of microbatch k's
# rows only ((k - 1) * per_section..k * per_section). No key crosses from
# the host.
[[setup]]
require = "chunk * d * 4 <= binding_limit"
because = "a sub-batch's keys are one binding"

[[setup]]
require = "sub * chunk == per_section"
because = "a microbatch is a whole number of sub-batches"

[[setup]]
require = "4 * max(arena_u32, arena_f32) <= binding_limit"
because = "an index arena is one binding"

[[setup]]
buffer = "rec_off"
element = "u32"
elements = "n_total + 1"
from = "rec_offsets"

[[setup]]
buffer = "rec_idx"
element = "u32"
elements = "nnz"
from = "rec_indices"

[[setup]]
buffer = "rec_val"
element = "f32"
elements = "nnz"
from = "rec_values"

# The search's keys binding: nothing to read (64 zero floats, the least a
# vec4 array binds).
[[setup]]
buffer = "nokeys"
element = "f32"
elements = "64"
fill = "zero"

[[setup]]
for = "s"
count = "seeds"
let = ["seed = select(s == 0, seed0, select(s == 1, seed1, select(s == 2, seed2, seed3)))"]

[[setup.body]]
buffer = "queries{s}"
element = "f32"
# The judged queries only (all the oracles unless a case judges fewer).
elements = "n_queries * d"
fill = "zero"

[[setup.body]]
uniform = "pq{s}"
of = "project.pcfg"
words = ["seed", "0", "n_stream", "n_queries"]

[[setup.body]]
machine = "project"
dispatch = { rec_offsets = "rec_off", rec_indices = "rec_idx", rec_values = "rec_val", keys = "queries{s}", pcfg = "pq{s}" }
workgroups = ["n_queries", "1", "1"]

[[setup.body]]
for = "k0"
count = "stages"

[[setup.body.body]]
for = "j"
count = "sub"

[[setup.body.body.body]]
buffer = "mb{s}_{k0}_{j}"
element = "f32"
elements = "chunk * d"
fill = "zero"

[[setup.body.body.body]]
uniform = "pk{s}_{k0}_{j}"
of = "project.pcfg"
words = ["seed", "0", "k0 * per_section + j * chunk", "chunk"]

[[setup.body.body.body]]
machine = "project"
dispatch = { rec_offsets = "rec_off", rec_indices = "rec_idx", rec_values = "rec_val", keys = "mb{s}_{k0}_{j}", pcfg = "pk{s}_{k0}_{j}" }
workgroups = ["chunk", "1", "1"]

# A run: four zeroed arenas a kind, then the five stages.
[[run]]
for = "s"
count = "seeds"

[[run.body]]
buffer = "iu{s}"
element = "u32"
elements = "arena_u32"
fill = "zero"

[[run.body]]
buffer = "if{s}"
element = "f32"
elements = "arena_f32"
fill = "zero"

[[run]]
for = "k0"
count = "stages"
let = ["stage = k0 + 1", "arrived_begin = k0 * per_section", "arrived_end = stage * per_section"]

[[run.body]]
for = "s"
count = "seeds"

[[run.body.body]]
buffer = "cands{k0}_{s}"
element = "u32"
elements = "n_queries * c_max"
fill = "pad"

# ingest: per sub-batch j, `passes` dispatches, one workgroup per arriving
# row; cfg's arrived_begin..arrived_end are the sub-batch's rows.
[[run.body.body]]
for = "j"
count = "sub"
let = ["sub_begin = arrived_begin + j * chunk", "sub_end = sub_begin + chunk"]

[[run.body.body.body]]
for = "p"
count = "passes"

[[run.body.body.body.body]]
uniform = "cfg{k0}_{s}_{j}_{p}"
of = "cfg"
words = ["s", "stage", "sub_begin", "sub_end", "n_queries", "p", "passes", "c_max"]

[[run.body.body.body.body]]
dispatch = { entry = "ingest", keys = "mb{s}_{k0}_{j}", queries = "queries{s}", index_u32 = "iu{s}", index_f32 = "if{s}", cands = "cands{k0}_{s}", cfg = "cfg{k0}_{s}_{j}_{p}" }
workgroups = ["chunk", "1", "1"]
sample = "ingest{stage}"

# search: one dispatch, one workgroup per query.
[[run.body.body]]
uniform = "cfgs{k0}_{s}"
of = "cfg"
words = ["s", "stage", "arrived_begin", "arrived_end", "n_queries", "0", "passes", "c_max"]

[[run.body.body]]
dispatch = { entry = "search", keys = "nokeys", queries = "queries{s}", index_u32 = "iu{s}", index_f32 = "if{s}", cands = "cands{k0}_{s}", cfg = "cfgs{k0}_{s}" }
workgroups = ["n_queries", "1", "1"]
sample = "search{stage}"

[[run.body.body]]
read = "cands{k0}_{s}"
into = "cands"
elements = "n_queries * c_max"
offset = "(k0 * seeds + s) * n_queries * c_max"

# One submission a stage AND SEED (each bounded by gpu_wait_ms; v24_ingest5b
# submits a stage's four seeds at once): at 1,000,000 rows an exhaustive
# search reads 1,000,000 rows a query, so a submit is kept to one seed's
# ingest and search and the display waits on one seed's work at a time.
[[run.body.body]]
sync = true

[[suite]]
name = "stream"
role = "constraint"
cases = "cases/stream.toml"
chunk = 1

[budget]
base_ms = 60000.0
round_ms = 60000.0
# Three fresh timing runs: each gives two samples a stage (the ingest
# through it, its search), each its own HFF input.
timing_rounds = 3
# One stage's submission (the reference's search sees no keys here and
# returns pads); 30 s bounds a runaway, as v24_ingest5's.
gpu_wait_ms = 30000.0
deadline_factor = 20.0
deadline_floor_ms = 120000.0
