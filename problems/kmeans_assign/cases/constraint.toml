# The correctness cases: generated inputs (problem.toml [[input]] generate),
# the shipped kernel's outputs as the expected (the oracle). No files.
# D_proj 2,048 is UltraDim's production key width (qdrant tests/parity.rs:839),
# 256 its other named width (lib.rs:1045); `band` set below the executor's
# cap makes a case run in several N-bands, the last one ragged, as
# assign_cosine_resident_banded does at large N.

[[case]]
name = "n256_c16_d2048"
params = { n = 256, c = 16, dp = 2048 }

[[case]]
name = "n777_c7_d2048_band512"
label = "n 777 c 7 dp 2048, bands of 512 (two, the last ragged)"
params = { n = 777, c = 7, dp = 2048, band = 512 }

[[case]]
name = "n300_c33_d256_band128"
label = "n 300 c 33 dp 256, bands of 128 (three)"
params = { n = 300, c = 33, dp = 256, band = 128 }

[[case]]
name = "n64_c300_d64"
label = "n 64 c 300 dp 64 (more centroids than points)"
params = { n = 64, c = 300, dp = 64 }

[[case]]
name = "n513_c1_d2048"
label = "n 513 c 1 dp 2048 (one centroid: every point assigned 0)"
params = { n = 513, c = 1, dp = 2048 }

[[case]]
name = "n1_c1_d1"
label = "n 1 c 1 dp 1"
params = { n = 1, c = 1, dp = 1 }
