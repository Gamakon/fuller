[package]
name = "fuller"
version = "0.1.0"
edition = "2021"
description = "Egglog-based bidirectional AST hub for symbolic expression rewriting"
license = "MIT"

[lib]
name = "fuller"
# rlib for Rust tests/examples; cdylib for the PyO3 extension module.
crate-type = ["rlib", "cdylib"]

[dependencies]
# Vendored egglog: our fork replaces the scalar Bellman-Ford extractor with the
# HFF angular multi-objective extractor (see vendor-egglog/src/extract.rs).
# The BF module compiles against the fork too (Extractor/TreeAdditiveCostModel
# are present in vendor-egglog) — do NOT pin crates.io egglog here.
egglog = { path = "vendor-egglog" }
rayon = "1.10"
# HFF math (TrueNorth angle + CDF correction) for the angular extraction cost
# model AND the BF study fitness. default-features=false drops HFF's PyO3
# layer — we use only the pure math in hff_core::core_functions / ::higd.
hff = { path = "../hff", default-features = false }
# GPU batch evaluator (feature = "gpu"). Versions match the hff crate so a
# workspace build shares one wgpu.
wgpu = { version = "0.20", optional = true }
pollster = { version = "0.3", optional = true }
bytemuck = { version = "1.14", features = ["derive"], optional = true }
# Used to hand an objective vector to hff_core's TrueNorth (matches hff's 0.15).
ndarray = "0.15"
# THE TELEMETRY STREAM and its viewer (`hff-watch`). Plain dependencies, NOT
# behind `gpu`: the viewer reads a recorded file and must build — and be linted —
# on a machine with no adapter, and `cargo test` must cover the schema.
#
# Crossterm is NOT named here. ratatui's default features already carry it and
# re-export it as `ratatui::crossterm`; the bin reads its events through that
# path, so the backend ratatui drives and the events the bin matches on are one
# type by construction. A second, independently-versioned `crossterm = "..."`
# line is how that becomes two types that will not talk to each other.
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dependencies.pyo3]
version = "0.22"
features = ["extension-module"]
optional = true

[features]
# `python` builds the PyO3 extension module; off by default so plain
# `cargo build` / `cargo test` / examples never need the Python link env.
default = []
python = ["dep:pyo3"]
# `gpu` adds the wgpu batch evaluator. Off by default: a plain build must never
# need a GPU adapter, and the CPU evaluator stays the correctness reference.
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

# The viewer's binary is named with a HYPHEN, as a command is; the file keeps
# the underscore Rust needs. It is NOT behind `gpu`: watching a recorded stream
# must work on a machine that could not run the fit that made it.
[[bin]]
name = "hff-watch"
path = "src/bin/hff_watch.rs"

# THE CONVERGENCE CHART. Not behind `gpu` either, and for the same reason: a
# figure is drawn from a RECORDING, on whatever machine the paper is being
# written on, which need not be one that could have run the fit.
[[bin]]
name = "hff-chart"
path = "src/bin/hff_chart.rs"

[[example]]
name = "00_calibration"

[[example]]
name = "bf_bloat_study"
path = "examples/bf_bloat/main.rs"

[[example]]
name = "bf_study"
path = "examples/bf_study/main.rs"

[[example]]
name = "bf_hff_study"
path = "examples/bf_hff_study/main.rs"

[[example]]
name = "parity_device"
required-features = ["gpu"]

[[example]]
name = "evolve_speed"
required-features = ["gpu"]

[[example]]
name = "evolve_fit"
required-features = ["gpu"]
