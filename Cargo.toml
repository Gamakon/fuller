[package]
name = "fuller"
version = "0.1.0"
edition = "2021"
description = "Egglog-based bidirectional AST hub for symbolic expression rewriting"
license = "MIT"

[lib]
name = "fuller"
# rlib for Rust tests/examples; cdylib for the PyO3 extension module.
crate-type = ["rlib", "cdylib"]

[dependencies]
# Vendored egglog: our fork replaces the scalar Bellman-Ford extractor with the
# HFF angular multi-objective extractor (see vendor-egglog/src/extract.rs).
# The BF module compiles against the fork too (Extractor/TreeAdditiveCostModel
# are present in vendor-egglog) — do NOT pin crates.io egglog here.
egglog = { path = "vendor-egglog" }
rayon = "1.10"
# HFF math (TrueNorth angle + CDF correction) for the angular extraction cost
# model AND the BF study fitness. default-features=false drops HFF's PyO3
# layer — we use only the pure math in hff_core::core_functions / ::higd.
hff = { path = "../hff", default-features = false }
# GPU batch evaluator (feature = "gpu"). Versions match the hff crate so a
# workspace build shares one wgpu.
wgpu = { version = "30.0.1", optional = true }
# wgpu's own mapping from a device's features to naga's capabilities
# (src/wgsl/target.rs), so the host validates as the device does.
wgpu-naga-bridge = { version = "30.0.1", optional = true }
pollster = { version = "0.3", optional = true }
bytemuck = { version = "1.14", features = ["derive"], optional = true }
# Used to hand an objective vector to hff_core's TrueNorth (matches hff's 0.15).
ndarray = "0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# egglog's own serialize() output type (extract::maximal_shared walks the DAG
# it returns directly — Node.children can share a child NodeId across
# parents, which the tree-shaped extractor cannot represent). Already in the
# tree transitively via egglog; declared directly since it is now a real
# library dependency, not example-only.
egraph-serialize = "0.3.0"

[dependencies.pyo3]
version = "0.22"
features = ["extension-module"]
optional = true

# The WGSL kingdom (feature = "wgsl"): naga is the front end that reads a
# kernel into its expression arena and the back end that writes a rebuilt
# module out again (kingdoms/wgsl, docs/PLAN_wgsl_kernel_reader.md). The same
# naga wgpu already pulls in (one naga, 30.0.1; docs/PLAN_naga_wgpu_30.md);
# `wgsl-out` and `msl-out` are declared here, not left to wgpu's features.
[dependencies.naga]
version = "30.0.1"
features = ["wgsl-in", "wgsl-out", "msl-out"]
optional = true

# The generic dispatch-program harness (src/wgsl/harness.rs) reads a
# problem's `problem.toml` and its case manifests.
[dependencies.toml]
version = "0.8"
optional = true

[dev-dependencies]
# TEST-ONLY oracle for the regex simplifier: render a Re AST to a regex string
# and compare match results before/after simplify. Never a run path.
regex = "1"
# TEST-ONLY: the saved-genome fixtures under tests/fixtures/wgsl_genomes are gzipped.
flate2 = "1"

[features]
# `python` builds the PyO3 extension module; off by default so plain
# `cargo build` / `cargo test` / examples never need the Python link env.
default = []
python = ["dep:pyo3"]
# `gpu` adds the wgpu batch evaluator. Off by default: a plain build must never
# need a GPU adapter, and the CPU evaluator stays the correctness reference.
gpu = ["dep:wgpu", "dep:wgpu-naga-bridge", "dep:pollster", "dep:bytemuck"]
# `wgsl` adds the WGSL kingdom's reader and loader (naga in and out). Off by
# default and independent of `gpu`: reading a kernel needs no adapter.
wgsl = ["dep:naga", "dep:toml"]

